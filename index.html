<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<title>Stocking · paper signals</title>
<script>try{var t=localStorage.getItem('stk_theme');t=t&&JSON.parse(t);if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <a class="logo" href="#/home" aria-label="Home">ST</a>
  <a class="brand" href="#/home"><b>Stocking</b><span>paper · alerts only</span></a>
  <span class="sp"></span>
  <span id="live" class="live" title=""><i></i><span>Live</span></span>
  <button id="theme" class="ibtn" aria-label="Toggle light/dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  <button id="refresh" class="ibtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</div></header>
<main id="view" class="wrap"><div class="skel" style="height:300px"></div><div class="skel"></div><div class="skel"></div></main>
<div class="wrap" style="padding-top:0"><div id="disc" class="note"></div></div>
<nav class="bnav"><div class="bnav-in" id="tabs">
  <a data-tab="home" href="#/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a data-tab="positions" href="#/positions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 16V9M12 16V5M17 16v-4"/></svg>Positions</a>
  <a data-tab="alerts" href="#/alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>Alerts</a>
  <a data-tab="pnl" href="#/pnl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>PnL</a>
  <a data-tab="more" href="#/more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>More</a>
</div></nav>
<script src="app.js"></script>
</body>
</html>
